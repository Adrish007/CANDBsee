<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DBsee • CAN DBC Editor</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link type="text/css" rel="stylesheet" href="styles.css">
</head>
<body>
<div class="loader-container">
    <!-- Display our custom favicon emblem during startup -->
    <img src="favicon.svg" alt="DBsee Logo" class="logo-pulse">
    
    <!-- Sleek teal spinning indicator -->
    <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 50 50" role="presentation">
        <circle cx="25" cy="25" r="20" stroke="#1E293B" stroke-width="4" fill="none"/>
        <circle cx="25" cy="25" r="20" stroke="#00F2FE" stroke-width="4" fill="none" stroke-linecap="round"
                stroke-dasharray="90 125">
            <animateTransform attributeName="transform" type="rotate" from="0 25 25" to="360 25 25" dur="0.8s"
                              repeatCount="indefinite"/>
        </circle>
    </svg>
    <div style="color: #64748B; font-size: 13px; font-weight: 600; letter-spacing: 0.5px;">INITIALIZING CAN DBC EDITOR...</div>
</div>
<script type="application/javascript" src="webApp.js"></script>
</body>
</html>
