<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="cyan-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>
    <linearGradient id="green-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background super-ellipse -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg-grad)" stroke="#1E293B" stroke-width="12" />

  <!-- Grid texture simulation for CAN matrix -->
  <path d="M 128 128 L 384 128 M 128 192 L 384 192 M 128 256 L 384 256 M 128 320 L 384 320 M 128 384 L 384 384 M 192 128 L 192 384 M 256 128 L 256 384 M 320 128 L 320 384" stroke="#1E293B" stroke-width="4" opacity="0.5" />

  <!-- CAN differential voltage signal waveform (CAN High / CAN Low representation) -->
  <path d="M 64 256 L 144 256 L 184 160 L 264 160 L 304 352 L 384 352 L 448 256" fill="none" stroke="url(#cyan-grad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />

  <!-- Network ECU node endpoints -->
  <circle cx="144" cy="256" r="18" fill="url(#green-grad)" stroke="#FFFFFF" stroke-width="6" />
  <circle cx="264" cy="160" r="22" fill="#F59E0B" stroke="#FFFFFF" stroke-width="6" />
  <circle cx="384" cy="352" r="18" fill="url(#green-grad)" stroke="#FFFFFF" stroke-width="6" />
  <circle cx="204" cy="280" r="12" fill="#38BDF8" />
  <circle cx="334" cy="220" r="12" fill="#A855F7" />
</svg>
